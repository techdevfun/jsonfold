name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
      - name: demo output must match expected-output.txt
        run: |
          ./examples/run-demo.sh > /tmp/demo.out
          diff -u examples/expected-output.txt /tmp/demo.out
